<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Listener</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Listener" />
  </head>
  <body class="flex h-dvh flex-col overflow-hidden bg-base-100 text-base-content" x-data="app">
    <header class="shrink-0 border-b border-base-300 bg-base-100">
      <div class="mx-auto flex w-full max-w-6xl items-center gap-2 px-3 py-2">
        <h1 class="hidden text-lg font-semibold tracking-tight sm:block">Listener</h1>
        <span
          class="badge badge-outline badge-sm whitespace-nowrap"
          :class="mode === 'playing' ? 'badge-success' : 'badge-outline'"
          x-text="statusLabel"
        ></span>
        <div role="tablist" class="tabs tabs-border">
          <button role="tab" class="tab" :class="view === 'library' ? 'tab-active' : ''" @click="view = 'library'">Library</button>
          <button role="tab" class="tab" :class="view === 'reader' ? 'tab-active' : ''" @click="view = 'reader'">Reader</button>
        </div>
        <span class="grow"></span>
        <button class="btn btn-sm btn-outline" x-show="view === 'reader'" @click="openLibrary()">
          <span class="sm:hidden">Docs</span>
          <span class="hidden sm:inline">Documents</span>
        </button>
        <button class="btn btn-sm btn-outline" @click="openSettings()">Settings</button>
      </div>
    </header>

    <div role="tablist" class="tabs tabs-border mx-3 mt-2 shrink-0 lg:hidden">
      <button role="tab" class="tab flex-1" :class="tab === 'doc' ? 'tab-active' : ''" @click="tab = 'doc'">Document</button>
      <button role="tab" class="tab flex-1" :class="tab === 'log' ? 'tab-active' : ''" @click="tab = 'log'">
        <span>Questions</span>
        <span class="badge badge-xs badge-primary" x-show="log.length" x-text="log.length"></span>
      </button>
    </div>


    <section
      x-data="library"
      x-show="view === 'library'"
      class="mx-auto flex min-h-0 w-full max-w-6xl flex-1 flex-col gap-2 p-3"
    >
      <div class="flex shrink-0 flex-wrap items-center gap-2">
        <label class="btn btn-sm btn-primary">
          Upload book
          <input type="file" accept=".md,.markdown,.txt,.epub" class="hidden" @change="upload($event)" />
        </label>
        <button class="btn btn-sm btn-outline" @click="showPaste = !showPaste">Paste text</button>
        <span class="text-xs text-base-content/50" x-show="busy">working…</span>
        <label class="ml-auto flex items-center gap-2 text-xs text-base-content/60">
          Voice
          <select x-model="voice" class="select select-sm max-w-40">
            <template x-for="option in voices" :key="option.id">
              <option :value="option.id" x-text="option.label"></option>
            </template>
          </select>
        </label>
      </div>

      <div x-show="showPaste" class="flex shrink-0 flex-col gap-2">
        <textarea x-model="pasted" class="textarea h-24 w-full font-mono text-xs" placeholder="Paste markdown or plain text…"></textarea>
        <button class="btn btn-sm w-fit" @click="paste()">Add document</button>
      </div>

      <div class="alert alert-error shrink-0 py-2 text-sm" x-show="error">
        <span x-text="error"></span>
        <button class="btn btn-xs btn-ghost" @click="error = ''">Dismiss</button>
      </div>

      <div class="min-h-0 flex-1 overflow-auto">
        <template x-if="!current">
          <div>
            <template x-for="document in documents" :key="document.id">
              <div class="group flex items-center gap-3 rounded-box px-3 py-2 hover:bg-base-200">
                <span class="grid size-10 shrink-0 place-items-center rounded bg-base-300 text-lg">▤</span>
                <button class="min-w-0 flex-1 text-left" @click="open(document)">
                  <span class="block truncate text-sm font-medium" x-text="document.title"></span>
                  <span class="text-xs text-base-content/50">
                    <span x-text="document.done + ' of ' + document.chapters + ' chapters'"></span>
                    <span x-show="document.duration"> · <span x-text="duration(document.duration)"></span></span>
                  </span>
                </button>
                <button class="btn btn-xs btn-outline" @click="open(document)">Open</button>
                <button class="btn btn-xs btn-outline btn-error" @click="remove(document)">Delete</button>
              </div>
            </template>
            <p class="mt-10 text-center text-sm text-base-content/50" x-show="documents.length === 0">
              Nothing here yet. Upload an EPUB, markdown or text file.
            </p>
          </div>
        </template>

        <template x-if="current">
          <div class="flex flex-col gap-3">
            <div class="flex items-center gap-3">
              <button class="btn btn-xs btn-outline" @click="close()">Back</button>
              <div class="grid size-16 shrink-0 place-items-center rounded-box bg-gradient-to-br from-primary/30 to-secondary/30 text-2xl">♫</div>
              <div class="min-w-0 flex-1">
                <h2 class="truncate text-lg font-semibold" x-text="current.title"></h2>
                <p class="text-xs text-base-content/50">
                  <span x-text="current.chapters.length + ' chapters'"></span>
                  <span x-show="current.duration"> · <span x-text="duration(current.duration)"></span></span>
                </p>
              </div>
              <button class="btn btn-sm btn-primary" @click="generateAll()">Generate all</button>
            </div>

            <ul class="divide-y divide-base-300/50">
              <template x-for="(chapter, index) in current.chapters" :key="chapter.id">
                <li
                  class="flex items-center gap-3 px-2 py-2"
                  :class="now?.id === chapter.id ? 'bg-base-200' : 'hover:bg-base-200/60'"
                >
                  <span class="w-5 shrink-0 text-right text-xs tabular-nums text-base-content/40" x-text="index + 1"></span>
                  <button class="min-w-0 flex-1 text-left" @click="toggle(chapter)">
                    <span
                      class="block truncate text-sm"
                      :class="now?.id === chapter.id ? 'font-medium text-primary' : ''"
                      x-text="chapter.title"
                    ></span>
                    <span class="text-xs" :class="chapter.status === 'error' ? 'text-error' : 'text-base-content/50'" x-text="status(chapter)"></span>
                  </button>
                  <span class="text-xs tabular-nums text-base-content/50" x-show="chapter.status === 'done'" x-text="duration(chapter.duration)"></span>
                  <button
                    class="btn btn-xs btn-square btn-outline"
                    x-show="chapter.status === 'done'"
                    @click="toggle(chapter)"
                    :aria-label="now?.id === chapter.id && playing ? 'Pause' : 'Play'"
                  >
                    <span x-text="now?.id === chapter.id && playing ? '❚❚' : '▶'"></span>
                  </button>
                  <button class="btn btn-xs btn-outline" x-show="['pending', 'error'].includes(chapter.status)" @click="generate(chapter)">
                    Generate
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </div>

      <div class="shrink-0 border-t border-base-300 pt-2" x-show="now">
        <div class="flex flex-wrap items-center gap-3">
          <div class="grid size-12 shrink-0 place-items-center rounded bg-base-300 text-lg">♪</div>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium" x-text="now?.title"></p>
            <p class="truncate text-xs text-base-content/50" x-text="current?.title"></p>
          </div>

          <div class="flex items-center gap-1">
            <button class="btn btn-sm btn-square btn-ghost" @click="previous()" aria-label="Previous">⏮</button>
            <button class="btn btn-sm btn-square btn-primary" @click="playing ? audio.pause() : audio.play()" aria-label="Play or pause">
              <span x-text="playing ? '❚❚' : '▶'"></span>
            </button>
            <button class="btn btn-sm btn-square btn-ghost" @click="next()" aria-label="Next">⏭</button>
          </div>

          <div class="flex min-w-56 flex-1 items-center gap-2">
            <span class="text-xs tabular-nums text-base-content/60" x-text="clock(position)"></span>
            <input
              type="range"
              class="range range-xs flex-1"
              min="0"
              step="1"
              :max="total || 0"
              :value="position"
              @input="seek($event)"
              aria-label="Seek"
            />
            <span class="text-xs tabular-nums text-base-content/60" x-text="clock(total)"></span>
          </div>

          <label class="flex items-center gap-1 text-xs text-base-content/60">
            Speed
            <select x-model.number="speed" @change="setSpeed()" class="select select-xs w-16">
              <option value="0.8">0.8</option>
              <option value="1">1.0</option>
              <option value="1.2">1.2</option>
              <option value="1.5">1.5</option>
              <option value="1.8">1.8</option>
            </select>
          </label>
        </div>
      </div>
    </section>

    <main x-show="view === 'reader'" class="mx-auto grid w-full max-w-6xl min-h-0 flex-1 gap-3 overflow-hidden p-3 lg:grid-cols-[minmax(0,1.7fr)_minmax(0,1fr)]">
      <section
        class="min-h-0 flex-1 flex-col overflow-hidden rounded-box bg-base-200"
        :class="tab === 'doc' ? 'flex' : 'hidden lg:flex'"
      >
        <div class="flex shrink-0 items-center justify-between gap-2 border-b border-base-300 px-3 py-2">
          <h2 class="truncate text-sm font-medium text-base-content/70" x-text="docTitle"></h2>
          <span class="shrink-0 text-xs text-base-content/50" x-text="chunkCount ? chunkCount + ' sentences' : ''"></span>
        </div>

        <textarea
          x-show="editing"
          x-model="doc"
          class="min-h-0 flex-1 resize-none bg-transparent p-3 font-mono text-sm outline-none"
          placeholder="Paste markdown here…"
        ></textarea>

        <article
          id="preview"
          x-show="!editing"
          x-ref="preview"
          class="prose prose-invert prose-sm min-h-0 max-w-none flex-1 overflow-auto p-3 sm:p-4"
        ></article>

        <div class="flex shrink-0 items-center gap-2 border-t border-base-300 px-3 py-2">
          <button class="btn btn-sm btn-primary" @click="start()">Start listening</button>
          <button class="btn btn-sm btn-outline" @click="editing = !editing" x-text="editing ? 'Preview' : 'Edit'"></button>
          <span class="grow"></span>
          <button class="btn btn-sm btn-outline" @click="newDocument()">New</button>
        </div>
      </section>

      <section
        class="min-h-0 flex-1 flex-col overflow-hidden rounded-box bg-base-200"
        :class="tab === 'log' ? 'flex' : 'hidden lg:flex'"
      >
        <div class="flex shrink-0 items-center justify-between gap-2 border-b border-base-300 px-3 py-2">
          <h2 class="text-sm font-medium text-base-content/70">Interruptions</h2>
          <button class="btn btn-xs btn-outline" @click="copyLog()" x-text="copied ? 'Copied' : 'Copy'"></button>
        </div>

        <p class="p-4 text-sm text-base-content/50" x-show="log.length === 0">
          None yet. Press <kbd class="kbd kbd-sm">i</kbd> while listening.
        </p>

        <ul class="min-h-0 flex-1 space-y-3 overflow-auto p-3">
          <template x-for="entry in log" :key="entry.at">
            <li class="rounded-box bg-base-300/40 p-3">
              <div class="flex items-center gap-2 text-xs text-base-content/50">
                <span x-text="formatTime(entry.at)"></span>
                <span>· sentence</span>
                <span x-text="entry.chunk + 1"></span>
                <button
                  class="btn btn-xs btn-outline ml-auto"
                  @click="replay(entry)"
                  aria-label="Speak this answer again"
                  x-show="settings.speakAnswers"
                >
                  <svg viewBox="0 0 16 16" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M2.5 8a5.5 5.5 0 1 1 1.7 4" />
                    <path d="M2 12.5V8.8h3.7" />
                  </svg>
                </button>
              </div>
              <p class="mt-1 text-sm font-medium" x-text="entry.question"></p>
              <p class="mt-1 line-clamp-5 text-sm text-base-content/70" x-text="entry.answer"></p>
            </li>
          </template>
        </ul>
      </section>
    </main>

    <footer x-show="view === 'reader'" class="shrink-0 border-t border-base-300 bg-base-100">
      <div class="mx-auto flex max-w-6xl flex-col gap-2 px-3 pt-2 pb-[max(0.5rem,env(safe-area-inset-bottom))]">
        <div class="flex items-center gap-2 text-xs text-base-content/50">
          <span x-text="progressText"></span>
          <span class="grow"></span>
          <span class="hidden text-base-content/40 md:inline" x-text="deployedLabel"></span>
          <span class="hidden md:inline">space pause · ←→ sentence · click text to jump · i ask · m talk</span>
        </div>

        <p class="line-clamp-2 min-h-9 text-sm leading-snug text-base-content/90" x-text="caption"></p>

        <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
          <div class="flex items-center justify-center gap-1.5 sm:justify-start">
            <button class="btn btn-square btn-outline sm:btn-sm" @click="seek(-1)" aria-label="Previous sentence">
              <svg viewBox="0 0 16 16" class="size-4" fill="currentColor"><path d="M4 3h2v10H4zM13 3v10L6.5 8z" /></svg>
            </button>
            <button class="btn btn-primary btn-square sm:btn-sm" @click="togglePlay()" aria-label="Play or pause">
              <svg x-show="mode !== 'playing'" viewBox="0 0 16 16" class="size-4" fill="currentColor"><path d="M5 3l8 5-8 5z" /></svg>
              <svg x-show="mode === 'playing'" viewBox="0 0 16 16" class="size-4" fill="currentColor"><path d="M4 3h3v10H4zM9 3h3v10H9z" /></svg>
            </button>
            <button class="btn btn-square btn-outline sm:btn-sm" @click="seek(1)" aria-label="Next sentence">
              <svg viewBox="0 0 16 16" class="size-4" fill="currentColor"><path d="M10 3h2v10h-2zM3 3v10l6.5-5z" /></svg>
            </button>
            <button class="btn btn-square btn-outline sm:btn-sm" @click="stop()" aria-label="Stop">
              <svg viewBox="0 0 16 16" class="size-4" fill="currentColor"><rect x="4" y="4" width="8" height="8" rx="1" /></svg>
            </button>
            <button
              type="button"
              class="btn btn-square btn-outline sm:btn-sm"
              :class="micState === 'recording' ? 'btn-error' : ''"
              :disabled="micState === 'transcribing'"
              @click="toggleMic()"
              :aria-label="micState === 'recording' ? 'Stop and transcribe' : 'Ask by voice'"
            >
              <svg x-show="micState !== 'recording'" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <rect x="6" y="2" width="4" height="7" rx="2" />
                <path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2" />
              </svg>
              <svg x-show="micState === 'recording'" viewBox="0 0 16 16" class="size-4" fill="currentColor"><rect x="4" y="4" width="8" height="8" rx="1" /></svg>
            </button>
          </div>

          <form class="flex min-w-0 flex-1 gap-2" @submit.prevent="ask()">
            <input
              x-ref="askInput"
              x-model="question"
              class="input min-w-0 flex-1 sm:input-sm"
              placeholder="Ask a question…"
              autocomplete="off"
              @focus="interruptForQuestion()"
              @keydown.escape="cancel()"
            />
            <button class="btn btn-outline sm:btn-sm" type="submit" :disabled="mode === 'answering'">Ask</button>
          </form>
        </div>
      </div>
    </footer>

    <div class="toast toast-top toast-center z-50" x-show="error" x-cloak>
      <div class="alert alert-error max-w-lg">
        <span class="text-sm" x-text="error"></span>
        <button class="btn btn-xs btn-ghost" @click="clearError()">Dismiss</button>
      </div>
    </div>

    <dialog x-ref="libraryDialog" class="modal">
      <div class="modal-box max-w-lg">
        <h3 class="text-base font-semibold">Documents</h3>
        <p class="mt-1 text-xs text-base-content/50">Each document keeps its own reading position and questions.</p>

        <ul class="mt-3 max-h-[50vh] space-y-2 overflow-auto">
          <template x-for="item in library" :key="item.id">
            <li class="flex items-center gap-2 rounded-box bg-base-200 px-3 py-2">
              <button class="min-w-0 flex-1 text-left" @click="open(item)">
                <span class="block truncate text-sm" x-text="item.title"></span>
                <span class="text-xs text-base-content/50">
                  <span x-text="formatDate(item.updatedAt)"></span>
                  <span> · sentence </span>
                  <span x-text="(item.position ?? 0) + 1"></span>
                  <span> · </span>
                  <span x-text="(item.log?.length ?? 0) + ' questions'"></span>
                </span>
              </button>
              <button class="btn btn-xs btn-error btn-outline" @click="remove(item)">Delete</button>
            </li>
          </template>
        </ul>

        <p class="mt-3 text-sm text-base-content/50" x-show="library.length === 0">No saved documents yet.</p>

        <div class="modal-action">
          <button class="btn btn-sm" @click="newDocument()">New document</button>
          <button class="btn btn-sm btn-ghost" @click="$refs.libraryDialog.close()">Close</button>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <dialog x-ref="settingsDialog" class="modal">
      <div class="modal-box">
        <h3 class="text-base font-semibold">Settings</h3>
        <div class="mt-3 grid gap-3">
          <fieldset class="fieldset">
            <legend class="fieldset-legend">API base URL</legend>
            <input x-model="draft.baseUrl" class="input w-full" placeholder="https://api.openai.com/v1" />
          </fieldset>
          <fieldset class="fieldset">
            <legend class="fieldset-legend">API key</legend>
            <input x-model="draft.apiKey" type="password" class="input w-full" placeholder="sk-…" />
          </fieldset>
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Model</legend>
            <input x-model="draft.model" class="input w-full" placeholder="gpt-4o-mini" />
          </fieldset>
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Voice</legend>
            <div class="max-h-56 space-y-1 overflow-auto rounded-box border border-base-300 p-1">
              <template x-for="voice in voices" :key="voice.id">
                <div
                  class="flex items-center gap-2 rounded-field px-2 py-1.5"
                  :class="draft.voice === voice.id ? 'bg-primary/15 ring-1 ring-primary/40' : 'hover:bg-base-200'"
                >
                  <button type="button" class="flex min-w-0 flex-1 items-baseline gap-2 text-left" @click="draft.voice = voice.id">
                    <span class="text-sm" x-text="voice.name"></span>
                    <span class="text-xs text-base-content/50" x-text="voice.group"></span>
                  </button>
                  <button
                    type="button"
                    class="btn btn-xs btn-outline"
                    @click="previewVoice(voice.id)"
                    :disabled="Boolean(previewing)"
                  >
                    <span x-show="previewing !== voice.id">Hear</span>
                    <span x-show="previewing === voice.id" class="loading loading-spinner loading-xs"></span>
                  </button>
                </div>
              </template>
            </div>
          </fieldset>
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Speed · <span x-text="Number(draft.speed).toFixed(2)"></span></legend>
            <input x-model="draft.speed" type="range" min="0.6" max="1.4" step="0.05" class="range w-full" />
          </fieldset>
          <label class="label cursor-pointer justify-start gap-3">
            <input x-model="draft.speakAnswers" type="checkbox" class="toggle toggle-sm" />
            <span class="text-sm">Speak answers aloud</span>
          </label>
        </div>
        <p class="mt-3 text-xs text-base-content/40" x-text="deployedLabel || 'dev build'"></p>

        <div class="mt-2 flex items-center gap-2">
          <button class="btn btn-xs btn-outline" @click="unloadModels()">Unload voice models</button>
          <span class="text-xs text-success" x-show="unloaded">Freed</span>
        </div>

        <div class="modal-action">
          <button class="btn btn-sm" @click="saveSettings()">Save</button>
          <button class="btn btn-sm btn-ghost" @click="$refs.settingsDialog.close()">Cancel</button>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
